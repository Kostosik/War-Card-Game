
name: Build and Release Game

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ветка, тег или commit для сборки"
        required: true
        default: master
        type: string
      release_tag:
        description: "Версия релиза, например v0.1.0"
        required: true
        type: string
      publish_release:
        description: "Опубликовать GitHub Release"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: game-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Настройка .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Публикация игры
        run: >
          dotnet publish ".\War Card Game.csproj"
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output ".\artifacts\publish"

      - name: Проверка сборки
        shell: pwsh
        run: |
          $publishRoot = Resolve-Path ".\artifacts\publish"

          $requiredFiles = @(
            "War Card Game.exe"
            "War Card Game.dll"
            "War Card Game.runtimeconfig.json"
            "War Card Game.deps.json"
            "Engine.Hosting.Desktop.dll"
            "Engine.Networking.Replication.dll"
            "glfw3.dll"
            "soft_oal.dll"
            "stbi.dll"
            "Scenes\Main.world"
          )

          $missingFiles = @(
            $requiredFiles | Where-Object {
              -not (
                Test-Path -LiteralPath (
                  Join-Path $publishRoot $_
                )
              )
            }
          )

          if ($missingFiles.Count -gt 0) {
            throw "Missing files: $($missingFiles -join ', ')"
          }

          if (-not (Test-Path (Join-Path $publishRoot "Assets"))) {
            throw "Assets directory is missing."
          }

          Write-Host "Game build verification passed."

      - name: Подготовка README
        shell: pwsh
        run: |
          @"
          War Card Game - Windows x64

          Requirements:
            - Windows x64
            - .NET 8 Desktop Runtime (x64)
            - Graphics and audio drivers

          Start:
            War Card Game.exe

          Source ref: ${{ inputs.ref }}
          Release version: ${{ inputs.release_tag }}

          Workflow:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          "@ | Set-Content `
            -Path ".\artifacts\publish\README.txt" `
            -Encoding utf8

      - name: Создание ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path ".\artifacts\publish\*" `
            -DestinationPath ".\artifacts\War-Card-Game-Windows-x64.zip" `
            -CompressionLevel Optimal

      - name: Проверка ZIP
        shell: pwsh
        run: |
          $archive = Resolve-Path ".\artifacts\War-Card-Game-Windows-x64.zip"
          $verifyRoot = Join-Path $env:RUNNER_TEMP "GameReleaseCheck"

          Expand-Archive `
            -LiteralPath $archive `
            -DestinationPath $verifyRoot `
            -Force

          $required = @(
            "War Card Game.exe"
            "War Card Game.runtimeconfig.json"
            "Engine.Hosting.Desktop.dll"
            "soft_oal.dll"
            "glfw3.dll"
            "Scenes\Main.world"
            "README.txt"
          )

          $missing = @(
            $required | Where-Object {
              -not (Test-Path (Join-Path $verifyRoot $_))
            }
          )

          if ($missing.Count -gt 0) {
            throw "ZIP verification failed: $($missing -join ', ')"
          }

          Write-Host "ZIP verification passed."

      - name: Загрузка сборки
        uses: actions/upload-artifact@v6
        with:
          name: War-Card-Game-Windows-x64
          path: .\artifacts\War-Card-Game-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    if: ${{ inputs.publish_release }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Получение проверенной сборки
        uses: actions/download-artifact@v6
        with:
          name: War-Card-Game-Windows-x64
          path: ./artifacts

      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ inputs.ref }}
          name: War Card Game ${{ inputs.release_tag }}
          generate_release_notes: true
          files: ./artifacts/War-Card-Game-Windows-x64.zip
          fail_on_unmatched_files: true
